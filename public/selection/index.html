<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择录制区域</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- This layer covers the entire window to capture mouse events on transparent areas -->
    <div id="event-capture-layer"></div>

    <!-- Overlay will be managed by the selection box's shadow -->
    <div id="selection-box" style="display: none;">
        <div class="resize-handle nw"></div>
        <div class="resize-handle n"></div>
        <div class="resize-handle ne"></div>
        <div class="resize-handle w"></div>
        <div class="resize-handle e"></div>
        <div class="resize-handle sw"></div>
        <div class="resize-handle s"></div>
        <div class="resize-handle se"></div>
    </div>
    <div id="size-badge" style="display: none;"></div>

    <div id="tooltip">
        拖动鼠标选择录制区域。按 <strong>Enter</strong> 确认，按 <strong>Esc</strong> 取消。
    </div>

    <script src="renderer.js"></script>
</body>
</html>
